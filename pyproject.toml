[project]
name = "lean-weave"
version = "0.1.0"
description = "Token-efficient AI coding pipeline (architecture validation in progress)"
readme = "README.md"
authors = [
    { name = "deliium", email = "notmailg@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.0",
]

[project.optional-dependencies]
spikes = [
    "openai>=1.40",
    "langgraph>=0.2",
    "langgraph-checkpoint-sqlite>=2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]
spikes = [
    "openai>=1.40",
    "langgraph>=0.2",
    "langgraph-checkpoint-sqlite>=2.0",
]

[project.scripts]
lean-weave = "lean_weave:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "spikes"]
addopts = "-q"
filterwarnings = [
    "ignore::DeprecationWarning",
]
