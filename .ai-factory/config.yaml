# AI Factory Configuration
# This file configures AI Factory behavior for your project.
# All sections are optional — defaults are used when not specified.

language:
  ui: en
  artifacts: en
  technical_terms: keep

paths:
  description: .ai-factory/DESCRIPTION.md
  architecture: .ai-factory/ARCHITECTURE.md
  docs: docs/
  roadmap: .ai-factory/ROADMAP.md
  research: .ai-factory/RESEARCH.md
  rules_file: .ai-factory/RULES.md
  plan: .ai-factory/PLAN.md
  plans: .ai-factory/plans/
  fix_plan: .ai-factory/FIX_PLAN.md
  security: .ai-factory/SECURITY.md
  references: .ai-factory/references/
  patches: .ai-factory/patches/
  evolutions: .ai-factory/evolutions/
  evolution: .ai-factory/evolution/
  specs: .ai-factory/specs/
  rules: .ai-factory/rules/
  qa: .ai-factory/qa/
  archive: .ai-factory/archive/

warmup:
  paths: []

workflow:
  auto_create_dirs: true
  plan_id_format: slug
  analyze_updates_architecture: true
  architecture_updates_roadmap: true
  verify_mode: normal

  # Default preferences for new plans (/aif-plan)
  # Options for plan_testing / plan_docs: ask, yes, no
  # Options for plan_logging: ask, verbose, standard, minimal
  plan_testing: yes
  plan_logging: verbose
  plan_docs: yes
  # Options: ask, true, false (YAML strings)
  plan_link_roadmap: ask

git:
  # Repo is not initialized yet; keep enabled for when git is added.
  # Until then, /aif-plan full skips branch/worktree creation.
  enabled: true
  base_branch: main
  create_branches: true
  branch_prefix: feature/
  skip_push_after_commit: false

rules:
  base: .ai-factory/rules/base.md
